<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b5e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Память" />
    <meta name="description" content="Футбольная память: находи одинаковые пары. Для iPad, без рекламы." />
    <title>Футбольная память</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section id="start-screen" class="screen is-active" aria-label="Выбор уровня">
        <div class="start-card">
          <p class="eyebrow">Футбол</p>
          <h1>Футбольная память</h1>
          <p class="lead">Карточки лежат рубашкой вверх. Найдите одинаковые пары.</p>
          <p id="offline-status" class="offline-status">При первом открытии игра сохранится на iPad.</p>
          <div class="mode-grid">
            <button class="mode-btn" data-level="easy" type="button">
              <span class="mode-title">6 карточек</span>
              <span class="mode-sub">3 пары · лёгкий</span>
            </button>
            <button class="mode-btn" data-level="medium" type="button">
              <span class="mode-title">12 карточек</span>
              <span class="mode-sub">6 пар · средний</span>
            </button>
            <button class="mode-btn" data-level="hard" type="button">
              <span class="mode-title">20 карточек</span>
              <span class="mode-sub">10 пар · сложный</span>
            </button>
          </div>
        </div>
      </section>

      <section id="play-screen" class="screen" hidden aria-label="Игра">
        <header class="play-bar">
          <button id="home-btn" class="ghost-btn" type="button">Назад</button>
          <p id="level-label" class="mode-chip">6 карточек</p>
          <p id="stats" class="score">Ходы 0 · Пары 0 / 3</p>
        </header>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <div id="board" class="board" role="group" aria-label="Карточки"></div>
      </section>

      <section id="result-screen" class="screen" hidden aria-label="Результат">
        <div class="result-card">
          <p class="eyebrow">Гол!</p>
          <h2 id="result-title">Все пары найдены</h2>
          <p id="result-score" class="result-score">0 ходов</p>
          <p id="result-text" class="lead"></p>
          <div class="result-actions">
            <button id="next-btn" class="primary-btn" type="button">Следующий уровень</button>
            <button id="replay-btn" class="secondary-btn" type="button">Играть ещё раз</button>
            <button id="menu-btn" class="ghost-btn ghost-btn-wide" type="button">К выбору уровня</button>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
